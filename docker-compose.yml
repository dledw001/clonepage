services:
  api:
    build: ./backend
    restart: unless-stopped
    extra_hosts:
      # Reach DSM over the LAN while keeping its verified HTTPS hostname.
      dsm.dledwith.com: "10.0.0.149"
    environment:
      READING_DB_PATH: /data/reading.sqlite3
      NAS_TEMPS_URL: ${NAS_TEMPS_URL:-http://10.0.0.149:8888}
      WUD_URL: ${WUD_URL:-http://10.0.0.149:3000}
      WUD_API_TOKEN: ${WUD_API_TOKEN:-}
      WUD_PUBLIC_URL: ${WUD_PUBLIC_URL:-}
      CLONEPAGE_ORIGIN: ${CLONEPAGE_ORIGIN:-https://clonepage.dledwith.com}
      DSM_URL: ${DSM_URL:-https://dsm.dledwith.com}
      DSM_PROXY_IP: ${DSM_PROXY_IP-10.0.0.149}
      DSM_SERVICE_DOMAIN: ${DSM_SERVICE_DOMAIN:-dledwith.com}
      DSM_UPSTREAM_HOSTS: ${DSM_UPSTREAM_HOSTS:-10.0.0.149,127.0.0.1,localhost}
    volumes:
      - ./data:/data

  web:
    build:
      context: .
      # Avoid DNS failures in the NAS BuildKit bridge during npm downloads.
      network: host
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:80"
    depends_on:
      - api

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-u", "worker.py"]
    environment:
      READING_DB_PATH: /data/reading.sqlite3
    volumes:
      - ./data:/data
    depends_on:
      - api
